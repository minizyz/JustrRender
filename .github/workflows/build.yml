name: Build JustrRender APK

on:
  push:
    branches: [ preview, main ]
  pull_request:
    branches: [ preview, main ]

env:
  ANDROID_COMPILE_SDK: 34
  ANDROID_BUILD_TOOLS: 34.0.0

jobs:
  Build Native Libraries:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download & Unpack Android NDK r25c
        run: |
          wget https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
          unzip -q android-ndk-r25c-linux.zip
          echo "$PWD/android-ndk-r25c" >> $GITHUB_PATH
        shell: bash

      - name: Build native libraries
        run: |
          cd app/src/main/jni
          ndk-build NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=./Android.mk NDK_APPLICATION_MK=./Application.mk

      - name: Copy libraries to jniLibs
        run: cp -r app/src/main/jni/libs/* app/src/main/jniLibs/

      - name: Upload native libraries
        uses: actions/upload-artifact@v4
        with:
          name: native-libs
          path: app/src/main/jniLibs

  Build APK:
    needs: Build Native Libraries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download native libraries artifact
        uses: actions/download-artifact@v4
        with:
          name: native-libs
          path: app/src/main/jniLibs

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: actions/setup-android-sdk@v1
        with:
          compile-sdk: ${{ env.ANDROID_COMPILE_SDK }}
          build-tools: ${{ env.ANDROID_BUILD_TOOLS }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: JustrRender-APK
          path: app/build/outputs/apk/debug/app-debug.apk

  Create Release:
    needs: Build APK
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: JustrRender-APK

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: JustrRender Release ${{ github.run_number }}
          generate_release_notes: true
          files:
            - app-debug.apk
