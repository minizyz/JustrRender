name: Build JustrRender APK

on:
  push:
    branches: [ main, master, preview ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master, preview ]
  workflow_dispatch:

env:
  ANDROID_COMPILE_SDK: "34"
  ANDROID_BUILD_TOOLS: "34.0.0"

jobs:
  build-native:
    name: Build Native Libraries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt update && sudo apt install -y wget unzip
        shell: bash

      - name: Download & Unpack Android NDK r25c
        run: |
          wget -O ndk.zip https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
          unzip -q ndk.zip
          echo "$PWD/android-ndk-r25c" >> $GITHUB_PATH
        shell: bash

      - name: Build native libraries
        run: |
          cd app/src/main/jni
          ndk-build NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=./Android.mk NDK_APPLICATION_MK=./Application.mk
        shell: bash

      - name: Copy libraries to jniLibs
        run: |
          # ndk-build 在 app/src/main/jni 目录运行，输出在 app/src/main/jni/libs/
          mkdir -p app/src/main/jniLibs
          cp -r app/src/main/jni/libs/* app/src/main/jniLibs/
          echo "=== jniLibs contents ==="
          ls -laR app/src/main/jniLibs/
        shell: bash

      - name: Upload native libraries
        uses: actions/upload-artifact@v4
        with:
          name: native-libs
          path: app/src/main/jniLibs/

  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    needs: build-native
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download native libraries
        uses: actions/download-artifact@v4
        with:
          name: native-libs
          path: app/src/main/jniLibs/

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x ./gradlew
        shell: bash

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace
        shell: bash

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace
        continue-on-error: true
        shell: bash

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: justr-render-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: justr-render-release
          path: app/build/outputs/apk/release/*.apk

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build-apk
    if: startsWith(github.ref, 'refs/tags/v')
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            justr-render-debug/*.apk
            justr-render-release/*.apk
